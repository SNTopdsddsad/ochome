<div id="archive-confirmation-study">
  <style>
    #archive-confirmation-study { width: 100%; }
    #archive-confirmation-study .study-controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; margin-bottom: 24px; }
    #archive-confirmation-study .study-controls label { display: grid; gap: 6px; }
    #archive-confirmation-study .paper-layout { width: min(100%, 380px); margin: 0 auto; }
    #archive-confirmation-study .paper-palette {
      color-scheme: light;
      --background: light-dark(#FAF6F0, #171412);
      --foreground: light-dark(#2B2622, #EDE7DF);
      --card: light-dark(#FFFFFF, #201C19);
      --card-foreground: light-dark(#2B2622, #EDE7DF);
      --primary: light-dark(#2B2622, #EDE7DF);
      --primary-foreground: light-dark(#FFFFFF, #201C19);
      --secondary: light-dark(#FAF6F0, #171412);
      --secondary-foreground: light-dark(#2B2622, #EDE7DF);
      --muted-foreground: light-dark(#2B2622, #EDE7DF);
      --border: light-dark(#EAE3D9, #35302B);
      --input: light-dark(#EAE3D9, #35302B);
      --ring: light-dark(#C2402A, #D96C5A);
      color: var(--foreground);
    }
    #archive-confirmation-study .paper-palette[data-mode="dark"] { color-scheme: dark; }
    /* The supplied product note explicitly assigns surface + border to dialogs. */
    #archive-confirmation-study .paper-palette > .card { border: 1px solid var(--border); }
    #archive-confirmation-study .paper-content { display: grid; gap: 22px; padding: 12px; }
    #archive-confirmation-study .context-line { display: flex; align-items: center; gap: 8px; }
    #archive-confirmation-study .target-group { display: grid; gap: 8px; }
    #archive-confirmation-study .paper-question { margin: 0; }
    #archive-confirmation-study .consequence { display: grid; gap: 8px; }
    #archive-confirmation-study .consequence p { margin: 0; }
    #archive-confirmation-study .paper-actions { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
    #archive-confirmation-study .sample-note { margin-top: 12px; }
    #archive-confirmation-study .selection-result { min-height: 24px; margin-top: 12px; }
    @media (max-width: 350px) {
      #archive-confirmation-study .paper-actions { grid-template-columns: 1fr; }
    }
  </style>
  <div class="study-controls">
    <label class="form-label" for="archive-scene">操作场景
      <select class="form-select" id="archive-scene">
        <option value="attribute">删除属性</option>
        <option value="history">恢复设定历史</option>
        <option value="cloud">iCloud 覆盖恢复</option>
      </select>
    </label>
    <label class="form-label" for="archive-mode">外观
      <select class="form-select" id="archive-mode">
        <option value="light">浅色 · 纸白</option>
        <option value="dark">深色 · 暖黑</option>
      </select>
    </label>
  </div>
  <div class="paper-layout">
    <div class="paper-palette" data-mode="light" id="archive-palette">
      <div class="card" role="group" aria-label="档案确认笺设计预览" aria-describedby="archive-sample-note">
        <div class="paper-content">
          <div class="context-line text-small">
            <i data-lucide="archive" aria-hidden="true"></i>
            <span>崽档</span><span aria-hidden="true">/</span><span id="archive-context">档案编辑</span>
          </div>
          <h2 class="paper-question" id="archive-question">删除这条属性？</h2>
          <div class="target-group">
            <span class="text-small" id="archive-target-label">属性</span>
            <span id="archive-target">随身物品</span>
          </div>
          <hr>
          <div class="consequence" aria-live="polite">
            <p id="archive-body">这条属性会从当前编辑中移除。</p>
            <p id="archive-effect">保存角色后生效。</p>
          </div>
          <div class="paper-actions" id="archive-actions">
            <div id="archive-cancel-cell"><button class="btn btn-block" id="archive-cancel" type="button">保留属性</button></div>
            <div id="archive-confirm-cell"><button class="btn btn-primary btn-block" id="archive-confirm" type="button">删除属性</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="sample-note text-small text-muted" id="archive-sample-note">版式与配色预览 · 名称和时间为示例</div>
    <div class="selection-result text-small" id="archive-result" role="status" aria-live="polite"></div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('archive-confirmation-study');
      const scenes = {
        attribute: { context: '档案编辑', title: '删除这条属性？', label: '属性', target: '随身物品', body: '这条属性会从当前编辑中移除。', effect: '保存角色后生效。', cancel: '保留属性', confirm: '删除属性' },
        history: { context: '设定历史', title: '恢复这一版设定？', label: '历史版本', target: '2026年9月3日  21:36', body: '恢复后立即替换设定，未保存的设定修改不会保留。', effect: '已有修改历史仍会保留。', cancel: '暂不恢复', confirm: '恢复此版' },
        cloud: { context: '备份恢复', title: '用备份覆盖本机档案？', label: '覆盖范围', target: '本机全部档案', body: '本机角色资料、设定历史和立绘将被 iCloud 备份替换。', effect: '覆盖后无法撤销。', cancel: '保留本机', confirm: '覆盖并恢复' }
      };
      const byId = (id) => root.querySelector('#' + id);
      const fields = { 'archive-context': 'context', 'archive-question': 'title', 'archive-target-label': 'label', 'archive-target': 'target', 'archive-body': 'body', 'archive-effect': 'effect', 'archive-cancel': 'cancel', 'archive-confirm': 'confirm' };
      const result = byId('archive-result');
      byId('archive-scene').addEventListener('change', (event) => {
        const scene = scenes[event.target.value];
        Object.entries(fields).forEach(([id, key]) => { byId(id).textContent = scene[key]; });
        result.textContent = '';
      });
      byId('archive-mode').addEventListener('change', (event) => {
        byId('archive-palette').dataset.mode = event.target.value;
      });
      ['archive-cancel', 'archive-confirm'].forEach((id) => {
        byId(id).addEventListener('click', () => {
          result.textContent = '预览选择：' + byId(id).textContent;
        });
      });
      const narrow = matchMedia('(max-width: 350px)');
      function orderActions() {
        const actions = byId('archive-actions');
        actions.append(narrow.matches ? byId('archive-confirm-cell') : byId('archive-cancel-cell'));
        actions.append(narrow.matches ? byId('archive-cancel-cell') : byId('archive-confirm-cell'));
      }
      narrow.addEventListener('change', orderActions);
      orderActions();
    })();
  </script>
</div>
